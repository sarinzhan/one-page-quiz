<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Page Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one narrow exercise-book column: set chips, mode switch, the card, then progress. Red pen = corrections. */
:root {
  --paper: #f6f7fb;
  --sheet: #ffffff;
  --ink: #1d2340;
  --muted: #6a7092;
  --rule: #dfe3f0;
  --accent: #2f4fd6;
  --accent-ink: #ffffff;
  --good: #1b8a5a;
  --good-bg: #e6f5ee;
  --pen: #d23b33;
  --pen-bg: #fdecea;
  --warn: #d9962b;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12152a; --sheet: #1b1f38; --ink: #e8eaf6; --muted: #9aa0c3; --rule: #2c3254;
    --accent: #7d93ff; --accent-ink: #0f1330; --good: #4fd19a; --good-bg: #173328; --pen: #ff7a70; --pen-bg: #3a1f22; --warn: #f0b552;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12152a; --sheet: #1b1f38; --ink: #e8eaf6; --muted: #9aa0c3; --rule: #2c3254;
  --accent: #7d93ff; --accent-ink: #0f1330; --good: #4fd19a; --good-bg: #173328; --pen: #ff7a70; --pen-bg: #3a1f22; --warn: #f0b552;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.hello { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.score { font-family: var(--f-hand); font-size: 1.7rem; color: var(--pen); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }

.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 500 .85rem var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.seg { display: flex; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: 600 .8rem var(--f-body); padding: 8px 8px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); }
.box { font-variant-numeric: tabular-nums; }
.prompt { font-size: 1.35rem; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.task { margin: -6px 0 0; color: var(--muted); font-size: .88rem; }

input[type="text"] { width: 100%; font: 500 1.1rem var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; outline: none; }
input[type="text"]:focus { border-color: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: 500 1rem var(--f-body); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--pen); background: var(--pen-bg); text-decoration: line-through; text-decoration-color: var(--pen); }
.opt:disabled { cursor: default; }

.fb { border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--pen-bg); }
.fb .mark { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1.1; }
.fb.good .mark { color: var(--good); }
.fb.bad .mark { color: var(--pen); }
.fb .ans { font-weight: 600; overflow-wrap: anywhere; }
.fb .tr { color: var(--muted); font-size: .9rem; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font: 600 1rem var(--f-body); cursor: pointer; }
.btn.main { flex: 1 1 160px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--rule); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--rule); }
.bar span { display: block; height: 100%; transition: width .3s; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.confirm .link.danger { color: var(--pen); }
body.tg .btn.main { display: none; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

/* additions for the word-set version */
.card { position: relative; transition: transform .22s ease, box-shadow .15s; }
.card.learnmode { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.card.dragging { transition: none; }
.card[data-swipe="right"] { box-shadow: inset 0 0 0 2px var(--good); }
.card[data-swipe="left"] { box-shadow: inset 0 0 0 2px var(--pen); }
.card[data-swipe]::after { position: absolute; top: 14px; padding: 4px 10px; border-radius: 8px; font: 700 .85rem var(--f-body); letter-spacing: .04em; }
.card[data-swipe="right"]::after { content: "I know it ✓"; right: 14px; color: var(--good); background: var(--good-bg); }
.card[data-swipe="left"]::after { content: "↺ Repeat"; left: 14px; color: var(--pen); background: var(--pen-bg); }
.swipehint { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

.screen { display: flex; flex-direction: column; gap: 18px; }
#practice { overflow-x: hidden; overflow-x: clip; padding: 4px; margin: -4px; }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.continue { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "lbl go" "what go"; align-items: center; gap: 2px 12px; text-align: left;
  border: 0; border-radius: 16px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-family: var(--f-body); }
.continue .c-lbl { grid-area: lbl; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .85; }
.continue .c-what { grid-area: what; font-size: 1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.continue .c-go { grid-area: go; font-size: 1.4rem; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.setrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; text-align: left; width: 100%;
  background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 14px; padding: 12px 14px; color: var(--ink); font-family: var(--f-body); cursor: pointer; }
.setrow[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.setrow .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); grid-row: span 2; }
.setrow[aria-checked="true"] .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 4px, transparent 5px); }
.setrow .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.setrow .t .new { display: inline-block; margin-left: 6px; font: 700 .62rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.setrow .num { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
.setrow .mini { height: 5px; border-radius: 9px; background: var(--rule); overflow: hidden; }
.setrow .mini span { display: block; height: 100%; background: var(--good); }
.wrap-chips { flex-wrap: wrap; overflow: visible; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 14px;
  padding: 14px; color: var(--ink); font-family: var(--f-body); cursor: pointer; min-width: 0; }
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile:disabled { opacity: .45; cursor: default; }
.tile .ic { font-size: 1.3rem; line-height: 1; }
.tile .nm { font-weight: 700; font-size: 1rem; }
.tile .ds { font-size: .82rem; color: var(--muted); line-height: 1.35; }
.tile .ct { margin-top: auto; padding-top: 6px; font-size: .78rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.tile.last { border-color: var(--accent); }
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.back { border: 1.5px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 600 .9rem var(--f-body); cursor: pointer; }
.ctx { display: flex; flex-direction: column; min-width: 0; }
.ctx-mode { font-weight: 700; font-size: 1.05rem; }
.ctx-set { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score.small { font-size: 1.4rem; }
body.tg .back { display: none; }
.continue:focus-visible, .setrow:focus-visible, .tile:focus-visible, .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

textarea#answer { width: 100%; min-height: 84px; resize: vertical; font: 500 1.05rem/1.4 var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; outline: none; }
textarea#answer:focus { border-color: var(--accent); }
.flip { display: flex; flex-direction: column; gap: 6px; border-top: 1.5px dashed var(--rule); padding-top: 12px; }
.flip .ru { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
.flip .ex, .fb .exru { font-size: .92rem; overflow-wrap: anywhere; }
.flip .ex { font-style: italic; }
.flip .exru, .fb .exru { color: var(--muted); }
.hint { background: none; border: 1.5px dashed var(--rule); border-radius: 12px; color: var(--muted); font: 500 .9rem var(--f-body); padding: 12px; cursor: pointer; text-align: center; }
.diff { display: flex; flex-direction: column; gap: 4px; font-size: .95rem; overflow-wrap: anywhere; }
.diff .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.diff del { color: var(--pen); text-decoration-thickness: 2px; }
.diff mark { background: transparent; color: var(--good); font-weight: 700; border-bottom: 2px solid var(--good); }
.override { align-self: flex-start; }

.notice { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; color: var(--muted); }
.notice.bad { color: var(--ink); background: var(--pen-bg); border-color: transparent; }
.notice code { background: var(--paper); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
.chip .new { display: inline-block; margin-left: 6px; font: 700 .62rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.chip[aria-pressed="true"] .new { color: inherit; opacity: .8; }
.chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.fb .ex { font-style: italic; color: var(--ink); opacity: .85; font-size: .92rem; overflow-wrap: anywhere; }
.tx { color: var(--muted); font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="notice">Loading words…</div>
  <div id="loadError" class="notice bad" hidden></div>

  <!-- ===== Screen 1: main menu ===== -->
  <div id="menu" class="screen" hidden>
    <header>
      <div>
        <h1>My English words</h1>
        <p class="hello" id="hello">From the book and lessons · RU ↔ EN</p>
      </div>
      <div class="score" id="totalScore" title="Learned words, all sets">– / –</div>
    </header>

    <button class="continue" id="continueBtn" hidden>
      <span class="c-lbl">Continue</span>
      <span class="c-what" id="continueWhat"></span>
      <span class="c-go" aria-hidden="true">→</span>
    </button>

    <section>
      <p class="label">1 · Word set</p>
      <div class="rows" id="sets" role="radiogroup" aria-label="Word set"></div>
    </section>

    <section id="topicSection" hidden>
      <p class="label">2 · Topic</p>
      <div class="chips wrap-chips" id="topics" role="radiogroup" aria-label="Topic"></div>
    </section>

    <section>
      <p class="label" id="modeLabel">3 · Choose how to practise</p>
      <div class="tiles" id="modes" role="group" aria-label="Mode"></div>
    </section>

    <div class="foot">
      <span id="storeInfo">Progress is saved in this browser</span>
      <span id="resetArea"><button class="link" id="resetBtn">Reset this set</button></span>
    </div>
  </div>

  <!-- ===== Screen 2: practice ===== -->
  <div id="practice" class="screen" hidden>
    <div class="topbar">
      <button class="back" id="backBtn">← Menu</button>
      <div class="ctx"><span class="ctx-mode" id="ctxMode"></span><span class="ctx-set" id="ctxSet"></span></div>
      <div class="score small" id="score" title="Learned in this selection">– / –</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="meta"><span id="topicName"></span><span class="box" id="boxInfo"></span></div>
      <p class="prompt" id="prompt"></p>
      <p class="task" id="task"></p>
      <div id="answerArea"></div>
      <div id="feedback"></div>
      <div class="row">
        <button class="btn main" id="mainBtn">Check</button>
        <button class="btn ghost" id="altBtn" hidden>Still learning</button>
        <button class="btn ghost" id="speakBtn" title="Listen to the English">🔊 Listen</button>
      </div>
    </section>

    <section class="progress">
      <p class="label" style="margin:0">Progress</p>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>

<!-- ================= WORDS =================
  One object in "sets" = one lesson or book page. The newest set shows first.
  Item fields: id (never change it, progress is saved by it), en, ru,
  optional: tr (transcription), ex (example sentence), exRu (its Russian translation), topic (key from "topics").
  A set may also have "sentences": [{"id": "s01", "en": "...", "ru": "..."}] for the Sentences mode.
  "a / b" in en = both answers accepted; "(to)" is optional when typing.
-->

<script>
/* One-page quiz. Words live in the WORDS JSON block (id="words") above this script.
   Progress: localStorage (always) + Telegram CloudStorage (when opened as a Mini App). */
const MAX_BOX = 3;              // 0 new/wrong · 1 learning · 2 almost · 3 learned
const LEARNED_FROM = 3;
const BOX_COLORS = ["var(--rule)", "var(--pen)", "var(--warn)", "var(--accent)", "var(--good)"];
const BOX_NAMES = ["New", "Wrong", "Learning", "Almost", "Learned"];
const NEW_DAYS = 7;
const ALL = "__all";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
const $ = id => document.getElementById(id);

let SETS = [];                 // [{id,title,added,topics,items:[{key,id,en,ru,topic,tr,ex,setId}]}]
let state = { set: null, topic: "all", mode: "write" };
let progress = {};             // setId -> { itemId: [box, seen, lastSeenDay] }
let current = null, lastKey = null, answered = false, choiceOptions = [];

/* ---------- storage ---------- */
const LS_PREFIX = "ew_p_";     // one key per set keeps each value small (CloudStorage limit 4096 chars)
const LS_STATE = "ew_state";
const cloudOK = inTelegram && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9");
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const parse = s => { try { return s ? JSON.parse(s) : null; } catch { return null; } };

function loadProgress(setIds) {
  setIds.forEach(id => { progress[id] = parse(lsGet(LS_PREFIX + id)) || {}; });
  // carry over progress from the first version of this page (key tq_progress_v1, numeric ids 0-32)
  const old = parse(lsGet("tq_progress_v1"));
  if (old && progress["lesson-01"] && !Object.keys(progress["lesson-01"]).length) {
    for (const k in old) progress["lesson-01"]["q" + String(+k + 1).padStart(2, "0")] = [old[k].b || 0, old[k].s || 0, 0];
    saveProgress("lesson-01");
  }
  if (!cloudOK) return Promise.resolve();
  return new Promise(res => {
    try {
      tg.CloudStorage.getItems(setIds.map(id => LS_PREFIX + id), (err, vals) => {
        if (!err && vals) setIds.forEach(id => {
          const cloud = parse(vals[LS_PREFIX + id]);
          if (cloud) progress[id] = merge(progress[id], cloud);
        });
        res();
      });
    } catch { res(); }
  });
}
// keep whichever record was seen more often (simple and good enough for one learner, several devices)
function merge(a, b) {
  const out = { ...a };
  for (const k in b) if (!out[k] || (b[k][1] || 0) > (out[k][1] || 0)) out[k] = b[k];
  return out;
}
function saveProgress(setId) {
  const s = JSON.stringify(progress[setId] || {});
  lsSet(LS_PREFIX + setId, s);
  if (cloudOK) { try { tg.CloudStorage.setItem(LS_PREFIX + setId, s); } catch {} }
}
function saveUiState() {
  const old = parse(lsGet(LS_STATE)) || {};
  lsSet(LS_STATE, JSON.stringify({ ...old, set: state.set, topic: state.topic, mode: state.mode }));
}

/* ---------- data: the WORDS block above this script ---------- */
const wordCount = t => t.split(/\s*\/\s*/)[0].replace(/[^\p{L}\p{N}' ]/gu, " ").trim().split(/\s+/).filter(Boolean).length;
function loadData() {
  const raw = JSON.parse(document.getElementById("words").textContent);
  const sets = raw.sets.map(s => {
    const items = (s.items || []).map(it => ({ ...it, setId: s.id, key: s.id + "/" + it.id }));
    // sentence pool: the set's "sentences" + word examples that have a translation (ex + exRu)
    // + items that already are phrases/sentences (3+ words)
    const sentences = [
      ...(s.sentences || []).map(x => ({ ...x, setId: s.id, key: s.id + "/" + x.id })),
      ...items.filter(it => it.ex && it.exRu).map(it => ({ id: "ex-" + it.id, en: it.ex, ru: it.exRu, topic: it.topic, word: it.en, setId: s.id, key: s.id + "/ex-" + it.id })),
      ...items.filter(it => wordCount(it.en) >= 3)
    ];
    return { id: s.id, title: s.title, added: s.added, topics: s.topics || null, items, sentences };
  });
  return sets.sort((a, b) => (b.added || "").localeCompare(a.added || ""));   // newest first
}

/* ---------- helpers ---------- */
const today = () => Math.floor(Date.now() / 864e5);
const rec = it => (progress[it.setId] || {})[it.id];
const boxOf = it => (rec(it) ? rec(it)[0] : 0);
const bucketOf = it => { const r = rec(it); return !r ? 0 : r[0] === 0 ? 1 : r[0] + 1; };
const isSentenceMode = () => state.mode === "sentences";
const listOf = (s, mode = state.mode) => (mode === "sentences" ? s.sentences : s.items);
const allItems = (mode = state.mode) => SETS.flatMap(s => listOf(s, mode));
const currentSet = () => SETS.find(s => s.id === state.set);
function setItems(mode = state.mode) { return state.set === ALL ? allItems(mode) : (currentSet() ? listOf(currentSet(), mode) : []); }
function pool(mode = state.mode) { return setItems(mode).filter(it => state.topic === "all" || it.topic === state.topic); }
function isNew(s) { return s.added && (Date.now() - Date.parse(s.added)) / 864e5 < NEW_DAYS; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pickNext() {
  const p = pool();
  if (state.mode === "learn") {
    const unseen = p.find(it => !rec(it));
    if (unseen) return unseen;
  }
  const list = p.length > 1 ? p.filter(it => it.key !== lastKey) : p;
  const weights = list.map(it => Math.pow(2, MAX_BOX - boxOf(it)) * (rec(it) ? 1 : 1.5)); // unseen words a bit more often
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= weights[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

/* ---------- answer checking ---------- */
function norm(s) {
  return s.toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/\([^)]*\)/g, " ")                 // "(to) run" → "run"
    .replace(/[.,!?…;:"«»]/g, " ")
    .replace(/\bcolor\b/g, "colour").replace(/\bfavorite\b/g, "favourite")
    .replace(/\bmom'?s\b/g, "mum's").replace(/\bmom\b/g, "mum")
    .replace(/\b(what|who|it|that|there|he|she|where|how)'s\b/g, "$1 is")
    .replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not")
    .replace(/\b(\w+)n't\b/g, "$1 not")
    .replace(/\bi'm\b/g, "i am").replace(/\b(\w+)'re\b/g, "$1 are").replace(/\b(\w+)'ve\b/g, "$1 have").replace(/\b(\w+)'ll\b/g, "$1 will")
    .replace(/^to /, "")                         // verbs: "to go" = "go"
    .replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
  for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1); // swapped letters = 1 typo
  }
  return d[a.length][b.length];
}
// word-level LCS: which words of a and b line up
function lcsAlign(a, b) {
  const n = a.length, m = b.length, d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const inA = new Array(n).fill(false), inB = new Array(m).fill(false);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (a[i] === b[j]) { inA[i] = inB[j] = true; i++; j++; }
    else if (d[i+1][j] >= d[i][j+1]) i++; else j++;
  }
  return { len: d[0][0], inA, inB };
}
function gradeSentence(input, en) {
  const a = norm(input);
  if (!a) return "empty";
  const targets = en.split(/\s*\/\s*/).map(norm);
  if (targets.includes(a)) return "right";
  // "almost" = same words, only spelling typos (each typo word ≥4 letters, 1 letter off; ≥7 letters, 2 off).
  // A different or missing word (bus/train, has/have, a) is a real mistake → "wrong", with the word diff shown.
  const ok = targets.some(b => {
    const ta = a.split(" "), tb = b.split(" ");
    if (ta.length !== tb.length) return false;
    let typos = 0;
    for (let i = 0; i < tb.length; i++) {
      if (ta[i] === tb[i]) continue;
      const d = lev(ta[i], tb[i]), w = tb[i].length;
      if (w < 4 || d > (w >= 7 ? 2 : 1)) return false;
      typos++;
    }
    return typos <= 2;
  });
  return ok ? "almost" : "wrong";
}
// en may hold alternatives: "flip-flops / slippers"
function grade(input, en) {
  const a = norm(input);
  if (!a) return "empty";
  const targets = en.split(/\s*\/\s*/).map(norm);
  if (targets.includes(a)) return "right";
  if (targets.some(b => b.length > 5 && lev(a, b) <= (b.length > 12 ? 2 : 1))) return "almost";
  return "wrong";
}

function topicName(id) { const s = currentSet(); return id !== "all" && s && s.topics ? s.topics[id] || "" : ""; }

function renderCard() {
  if (current) lastKey = current.key;          // never show the same card twice in a row
  current = pickNext(); answered = false;
  $("feedback").innerHTML = "";
  const area = $("answerArea"); area.innerHTML = "";
  if (!current) {
    $("prompt").textContent = isSentenceMode() ? "No sentences in this set yet." : "No words here yet.";
    $("task").textContent = isSentenceMode() ? "Sentences come from example sentences with a translation (ex + exRu) or from the set's sentence list." : "";
    $("topicName").textContent = ""; $("boxInfo").textContent = ""; $("altBtn").hidden = true; setMainText("—");
    return;
  }
  const it = current, m = state.mode;
  $("topicName").textContent = topicLabel(it);
  $("boxInfo").textContent = BOX_NAMES[bucketOf(it)];
  $("altBtn").hidden = true;
  $("card").classList.toggle("learnmode", m === "learn");
  if (m === "learn") {
    $("prompt").textContent = it.en + (it.tr ? "  " + it.tr : "");
    const left = pool().filter(x => !rec(x)).length;
    $("task").textContent = left ? `New: ${left} left · try to recall the meaning` : "Review · try to recall the meaning";
    const hint = document.createElement("button");
    hint.className = "hint"; hint.id = "reveal"; hint.textContent = "Tap to see the translation";
    hint.addEventListener("click", reveal);
    area.appendChild(hint);
    const sh = document.createElement("div"); sh.className = "swipehint";
    sh.innerHTML = "<span>← swipe: repeat</span><span>swipe: I know it →</span>";
    area.appendChild(sh);
    setMainText("Show translation");
    speak(it.en);
    return;
  }
  if (m === "sentences") {
    $("prompt").textContent = it.ru;
    $("task").textContent = it.word ? `Translate into English · uses “${it.word}”` : "Translate into English";
    const ta = document.createElement("textarea");
    ta.id = "answer"; ta.setAttribute("autocapitalize", "sentences"); ta.spellcheck = false; ta.rows = 3;
    ta.placeholder = "Type the English sentence…";
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onMain(); } });
    area.appendChild(ta);
    setMainText("Check");
    if (!inTelegram && window.matchMedia("(pointer: fine)").matches) setTimeout(() => ta.focus({ preventScroll: true }), 30);
    return;
  }
  if (m === "write") {
    $("prompt").textContent = it.ru;
    $("task").textContent = "Write it in English";
    const inp = document.createElement("input");
    inp.type = "text"; inp.id = "answer"; inp.autocomplete = "off"; inp.setAttribute("autocapitalize", "none"); inp.spellcheck = false;
    inp.placeholder = "Type in English…";
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); onMain(); } });
    area.appendChild(inp);
    setMainText("Check");
    if (!inTelegram && window.matchMedia("(pointer: fine)").matches) setTimeout(() => inp.focus({ preventScroll: true }), 30);
  } else {
    const isEn = m === "pickEn";
    $("prompt").textContent = isEn ? it.ru : it.en;
    $("task").textContent = isEn ? "Choose the English" : "Выбери перевод";
    const src = setItems().length >= 4 ? setItems() : allItems();
    const others = shuffle(src.filter(x => x.key !== it.key && x.en !== it.en));
    const same = others.filter(x => x.topic && x.topic === it.topic), rest = others.filter(x => !(x.topic && x.topic === it.topic));
    choiceOptions = shuffle([it, ...same.concat(rest).slice(0, 3)]);
    const box = document.createElement("div"); box.className = "opts";
    choiceOptions.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "opt"; b.id = "opt" + i; b.textContent = isEn ? o.en : o.ru;
      b.addEventListener("click", () => choose(i));
      box.appendChild(b);
    });
    area.appendChild(box);
    setMainText("Skip");

}

function showFeedback(kind, input) {
  const it = current, fb = $("feedback");
  const marks = { right: "Well done! ✓", almost: "Almost! Check the spelling", wrong: "Correct answer:" };
  const wrap = document.createElement("div");
  wrap.className = "fb " + (kind === "wrong" ? "bad" : "good");
  const mark = document.createElement("span"); mark.className = "mark"; mark.textContent = marks[kind]; wrap.append(mark);
  const ans = document.createElement("span"); ans.className = "ans";
  ans.textContent = state.mode === "pickRu" ? it.ru : it.en;
  if (it.tr && state.mode !== "pickRu") { const t = document.createElement("span"); t.className = "tx"; t.textContent = it.tr; ans.append(t); }
  wrap.append(ans);
  const tr = document.createElement("span"); tr.className = "tr"; tr.textContent = state.mode === "pickRu" ? it.en : it.ru; wrap.append(tr);
  if (it.ex && !isSentenceMode()) { const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = it.ex; wrap.append(ex); }
  if (it.exRu && !isSentenceMode()) { const er = document.createElement("span"); er.className = "exru"; er.textContent = it.exRu; wrap.append(er); }
  if (input !== undefined && kind !== "right" && wordCount(it.en) >= 2) {
    ans.remove(); wrap.insertBefore(renderDiff(input, it.en), tr);
    if (kind === "wrong") mark.textContent = "Not quite:";
  }
  if (kind === "wrong" && input !== undefined) {
    const o = document.createElement("button"); o.className = "link override"; o.id = "overrideBtn";
    o.textContent = "My answer is also correct"; o.addEventListener("click", overrideCorrect); wrap.append(o);
  }
  fb.innerHTML = ""; fb.append(wrap);
}

function reveal() {
  if (answered) return;
  answered = true; haptic("tap");
  const it = current, area = $("answerArea"); area.innerHTML = "";
  const f = document.createElement("div"); f.className = "flip";
  const add = (cls, text) => { if (!text) return; const e = document.createElement("span"); e.className = cls; e.textContent = text; f.append(e); };
  add("ru", it.ru); add("ex", it.ex); add("exru", it.exRu);
  area.append(f);
  const sh = document.createElement("div"); sh.className = "swipehint";
  sh.innerHTML = "<span>← swipe: repeat</span><span>swipe: I know it →</span>";
  area.append(sh);
  setMainText("I know it ✓");
  $("altBtn").hidden = false;
}
function learnAnswer(known, viaSwipe = false) {
  if (!answered && !viaSwipe) return;
  answered = true;
  record(known); haptic(known ? "success" : "warning");
  renderCard();
}

// show the learner's answer with wrong words struck, and the correct sentence with missed words marked
function renderDiff(input, en) {
  const target = en.split(/\s*\/\s*/)[0];
  const rawA = input.trim().split(/\s+/), rawB = target.trim().split(/\s+/);
  const key = w => norm(w).replace(/ /g, "");
  const { inA, inB } = lcsAlign(rawA.map(key), rawB.map(key));
  const box = document.createElement("div"); box.className = "diff";
  const line = (label, words, flags, tag) => {
    const l = document.createElement("span"); l.className = "lbl"; l.textContent = label; box.append(l);
    const row = document.createElement("span");
    words.forEach((w, i) => {
      const el = document.createElement(flags[i] ? "span" : tag); el.textContent = w;
      row.append(el, document.createTextNode(" "));
    });
    box.append(row);
  };
  line("Your answer", rawA, inA, "del");
  line("Correct", rawB, inB, "mark");
  return box;
}
let undoRecord = null;
function overrideCorrect() {
  if (!undoRecord) return;
  const { setId, id, prev } = undoRecord;
  const r = prev ? prev.slice() : [0, 0, 0];
  r[1]++; r[2] = today(); r[0] = Math.min(MAX_BOX, r[0] + 1);
  progress[setId][id] = r; saveProgress(setId); renderProgress();
  undoRecord = null; haptic("success");
  const fb = $("feedback").querySelector(".fb");
  fb.className = "fb good"; fb.querySelector(".mark").textContent = "Counted as correct ✓";
  const b = $("overrideBtn"); if (b) b.remove();
}

function record(ok) {
  const it = current;
  const p = progress[it.setId] || (progress[it.setId] = {});
  undoRecord = { setId: it.setId, id: it.id, prev: p[it.id] ? p[it.id].slice() : null };
  const r = p[it.id] || [0, 0, 0];
  r[1]++; r[2] = today(); r[0] = ok ? Math.min(MAX_BOX, r[0] + 1) : 0;
  p[it.id] = r;
  saveProgress(it.setId);
  renderProgress();
}

function check() {
  const inp = $("answer"); const g = (isSentenceMode() ? gradeSentence : grade)(inp.value, current.en);
  if (g === "empty") { inp.focus(); haptic("warning"); return; }
  answered = true; inp.disabled = true;
  const ok = g !== "wrong";
  record(ok); showFeedback(g, inp.value); haptic(ok ? "success" : "error");
  if (ok) speak(current.en);
  setMainText("Next →");
}

function choose(i) {
  if (answered) return;
  answered = true; haptic("tap");
  const ok = choiceOptions[i].key === current.key;
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (choiceOptions[j].key === current.key) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
  });
  record(ok); showFeedback(ok ? "right" : "wrong"); haptic(ok ? "success" : "error");
  if (ok) speak(current.en);
  setMainText("Next →");
}

function onMain() {
  if (!current) return;
  if (state.mode === "learn") return answered ? learnAnswer(true) : reveal();
  if (answered) return renderCard();
  if (state.mode === "write" || state.mode === "sentences") return check();
  renderCard();
}

function renderProgress() {
  const list = pool();
  const buckets = [0, 0, 0, 0, 0];
  list.forEach(it => { buckets[bucketOf(it)] += 1; });
  $("bar").innerHTML = list.length ? buckets.map((n, i) => n ? `<span style="width:${n / list.length * 100}%;background:${BOX_COLORS[i]}" title="${BOX_NAMES[i]}: ${n}"></span>` : "").join("") : "";
  $("legend").innerHTML = buckets.map((n, i) => `<span><i style="background:${BOX_COLORS[i]}"></i>${BOX_NAMES[i]} ${n}</span>`).join("");
  const items = setItems();
  $("score").textContent = `${items.filter(it => boxOf(it) >= LEARNED_FROM).length} / ${items.length}`;
}

function renderAll() { if (screen === "menu") renderMenu(); else { renderProgress(); renderCard(); } }

/* ---------- speech ---------- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.split(/\s*\/\s*/)[0].replace(/…/g, ""));
    u.lang = "en-GB"; u.rate = 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}

/* ---------- swipe (Learn mode): right = I know it, left = repeat ---------- */
(function setupSwipe() {
  const card = $("card");
  let sw = null, suppressClick = false;
  const reset = () => { card.classList.remove("dragging"); card.style.transform = ""; delete card.dataset.swipe; };
  card.addEventListener("pointerdown", e => {
    if (screen !== "practice" || state.mode !== "learn" || !current || e.button > 0) return;
    if (e.target.closest("#mainBtn, #altBtn, #speakBtn")) return;
    sw = { x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId };
  });
  card.addEventListener("pointermove", e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.active) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.active = true; card.classList.add("dragging");
        try { card.setPointerCapture(sw.id); } catch {}
      } else if (Math.abs(dy) > 14) { sw = null; return; }
      else return;
    }
    sw.dx = dx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    if (dx > 50) card.dataset.swipe = "right"; else if (dx < -50) card.dataset.swipe = "left"; else delete card.dataset.swipe;
  });
  const end = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const { active, dx } = sw; sw = null;
    if (!active) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
    card.classList.remove("dragging");
    if (Math.abs(dx) < 90) { reset(); return; }
    const known = dx > 0;
    card.style.transform = `translateX(${known ? 120 : -120}%) rotate(${known ? 12 : -12}deg)`;
    setTimeout(() => {
      card.classList.add("dragging"); reset();
      learnAnswer(known, true);
      requestAnimationFrame(() => card.classList.remove("dragging"));
    }, 200);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", e => { if (sw && e.pointerId === sw.id) { sw = null; reset(); } });
  card.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ---------- wiring ---------- */
$("mainBtn").addEventListener("click", onMain);
$("altBtn").addEventListener("click", () => learnAnswer(false));
$("speakBtn").addEventListener("click", () => current && speak(current.en));
$("backBtn").addEventListener("click", () => goMenu());
$("continueBtn").addEventListener("click", () => startPractice(state.mode));
window.addEventListener("popstate", () => { if (screen === "practice") goMenu(true); });
document.addEventListener("keydown", e => {
  if (screen !== "practice") return;
  if (e.key === "Escape") { goMenu(); return; }
  if (e.target.id === "answer" || e.target.tagName === "BUTTON") return;
  if (e.key === "Enter" && (answered || state.mode === "learn")) { e.preventDefault(); onMain(); }
  if (state.mode === "learn" && answered && (e.key === "Backspace" || e.key === "2")) learnAnswer(false);
  if (state.mode === "learn" && e.key === "ArrowRight") learnAnswer(true, true);
  if (state.mode === "learn" && e.key === "ArrowLeft") learnAnswer(false, true);
  if (!answered && (state.mode === "pickEn" || state.mode === "pickRu") && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
});
$("resetArea").addEventListener("click", e => {
  const id = e.target.id, area = $("resetArea");
  const plain = `<button class="link" id="resetBtn">Reset this set</button>`;
  if (id === "resetBtn") {
    area.innerHTML = `<span class="confirm">Delete progress for this set? <button class="link danger" id="resetYes">Yes, reset</button><button class="link" id="resetNo">Cancel</button></span>`;
  } else if (id === "resetYes") {
    const ids = state.set === ALL ? SETS.map(s => s.id) : [state.set];
    ids.forEach(sid => { progress[sid] = {}; saveProgress(sid); });
    renderMenu(); area.innerHTML = plain;
  } else if (id === "resetNo") area.innerHTML = plain;
});

(async function start() {
  setupTelegram();
  if (cloudOK) $("storeInfo").textContent = "Progress syncs with your Telegram account";
  try {
    SETS = loadData();
  } catch (err) {
    $("loading").hidden = true;
    const box = $("loadError"); box.hidden = false;
    box.textContent = "The word list in this page has a formatting error: " + err.message;
    return;
  }
  await loadProgress(SETS.map(s => s.id));
  const saved = parse(lsGet(LS_STATE)) || {};
  state.set = (saved.set && (saved.set === ALL || SETS.some(s => s.id === saved.set))) ? saved.set : (SETS[0] && SETS[0].id);
  const cs = currentSet();
  state.topic = saved.topic && cs && cs.topics && cs.topics[saved.topic] ? saved.topic : "all";
  if (saved.mode && MODES.some(m => m.id === saved.mode)) state.mode = saved.mode;
  $("loading").hidden = true;
  showScreen("menu", false);
  renderMenu();
})();

</script>
