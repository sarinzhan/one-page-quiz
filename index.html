<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Page Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one narrow exercise-book column: set chips, mode switch, the card, then progress. Red pen = corrections. */
:root {
  --paper: #f6f7fb;
  --sheet: #ffffff;
  --ink: #1d2340;
  --muted: #6a7092;
  --rule: #dfe3f0;
  --accent: #2f4fd6;
  --accent-ink: #ffffff;
  --good: #1b8a5a;
  --good-bg: #e6f5ee;
  --pen: #d23b33;
  --pen-bg: #fdecea;
  --warn: #d9962b;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12152a; --sheet: #1b1f38; --ink: #e8eaf6; --muted: #9aa0c3; --rule: #2c3254;
    --accent: #7d93ff; --accent-ink: #0f1330; --good: #4fd19a; --good-bg: #173328; --pen: #ff7a70; --pen-bg: #3a1f22; --warn: #f0b552;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12152a; --sheet: #1b1f38; --ink: #e8eaf6; --muted: #9aa0c3; --rule: #2c3254;
  --accent: #7d93ff; --accent-ink: #0f1330; --good: #4fd19a; --good-bg: #173328; --pen: #ff7a70; --pen-bg: #3a1f22; --warn: #f0b552;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.hello { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.score { font-family: var(--f-hand); font-size: 1.7rem; color: var(--pen); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }

.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 500 .85rem var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.seg { display: flex; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: 600 .8rem var(--f-body); padding: 8px 8px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); }
.box { font-variant-numeric: tabular-nums; }
.prompt { font-size: 1.35rem; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.task { margin: -6px 0 0; color: var(--muted); font-size: .88rem; }

input[type="text"] { width: 100%; font: 500 1.1rem var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; outline: none; }
input[type="text"]:focus { border-color: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: 500 1rem var(--f-body); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--pen); background: var(--pen-bg); text-decoration: line-through; text-decoration-color: var(--pen); }
.opt:disabled { cursor: default; }

.fb { border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--pen-bg); }
.fb .mark { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1.1; }
.fb.good .mark { color: var(--good); }
.fb.bad .mark { color: var(--pen); }
.fb .ans { font-weight: 600; overflow-wrap: anywhere; }
.fb .tr { color: var(--muted); font-size: .9rem; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font: 600 1rem var(--f-body); cursor: pointer; }
.btn.main { flex: 1 1 160px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--rule); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--rule); }
.bar span { display: block; height: 100%; transition: width .3s; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.confirm .link.danger { color: var(--pen); }
body.tg .btn.main { display: none; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

/* additions for the word-set version */
.card { position: relative; transition: transform .22s ease, box-shadow .15s; }
.card.learnmode { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.card.dragging { transition: none; }
.card[data-swipe="right"] { box-shadow: inset 0 0 0 2px var(--good); }
.card[data-swipe="left"] { box-shadow: inset 0 0 0 2px var(--pen); }
.card[data-swipe]::after { position: absolute; top: 14px; padding: 4px 10px; border-radius: 8px; font: 700 .85rem var(--f-body); letter-spacing: .04em; }
.card[data-swipe="right"]::after { content: "I know it ✓"; right: 14px; color: var(--good); background: var(--good-bg); }
.card[data-swipe="left"]::after { content: "↺ Repeat"; left: 14px; color: var(--pen); background: var(--pen-bg); }
.swipehint { display: flex; justify-content: space-between; gap: 10px; }
.swipebtn { flex: 1 1 0; border: 1.5px solid currentColor; border-radius: 12px; padding: 10px 12px; font: 600 .9rem var(--f-body); cursor: pointer; }
.swipebtn.repeat { color: var(--pen); background: var(--pen-bg); }
.swipebtn.know { color: var(--good); background: var(--good-bg); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

.screen { display: flex; flex-direction: column; gap: 18px; }
#practice { overflow-x: hidden; overflow-x: clip; padding: 4px; margin: -4px; }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.continue { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "lbl go" "what go"; align-items: center; gap: 2px 12px; text-align: left;
  border: 0; border-radius: 16px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-family: var(--f-body); }
.continue .c-lbl { grid-area: lbl; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .85; }
.continue .c-what { grid-area: what; font-size: 1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.continue .c-go { grid-area: go; font-size: 1.4rem; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.setrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; text-align: left; width: 100%;
  background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 14px; padding: 12px 14px; color: var(--ink); font-family: var(--f-body); cursor: pointer; }
.setrow[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.setrow .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); grid-row: span 2; }
.setrow[aria-checked="true"] .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 4px, transparent 5px); }
.setrow .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.setrow .t .new { display: inline-block; margin-left: 6px; font: 700 .62rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.setrow .num { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
.setrow .mini { height: 5px; border-radius: 9px; background: var(--rule); overflow: hidden; }
.setrow .mini span { display: block; height: 100%; background: var(--good); }
.wrap-chips { flex-wrap: wrap; overflow: visible; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 14px;
  padding: 14px; color: var(--ink); font-family: var(--f-body); cursor: pointer; min-width: 0; }
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile:disabled { opacity: .45; cursor: default; }
.tile .ic { font-size: 1.3rem; line-height: 1; }
.tile .nm { font-weight: 700; font-size: 1rem; }
.tile .ds { font-size: .82rem; color: var(--muted); line-height: 1.35; }
.tile .ct { margin-top: auto; padding-top: 6px; font-size: .78rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.tile.last { border-color: var(--accent); }
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.back { border: 1.5px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 600 .9rem var(--f-body); cursor: pointer; }
.ctx { display: flex; flex-direction: column; min-width: 0; }
.ctx-mode { font-weight: 700; font-size: 1.05rem; }
.ctx-set { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score.small { font-size: 1.4rem; }
body.tg .back { display: none; }
.continue:focus-visible, .setrow:focus-visible, .tile:focus-visible, .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

textarea#answer { width: 100%; min-height: 84px; resize: vertical; font: 500 1.05rem/1.4 var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; outline: none; }
textarea#answer:focus { border-color: var(--accent); }
.flip { display: flex; flex-direction: column; gap: 6px; border-top: 1.5px dashed var(--rule); padding-top: 12px; }
.flip .ru { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
.flip .ex, .fb .exru { font-size: .92rem; overflow-wrap: anywhere; }
.flip .ex { font-style: italic; }
.flip .exru, .fb .exru { color: var(--muted); }
.hint { background: none; border: 1.5px dashed var(--rule); border-radius: 12px; color: var(--muted); font: 500 .9rem var(--f-body); padding: 12px; cursor: pointer; text-align: center; }
.diff { display: flex; flex-direction: column; gap: 4px; font-size: .95rem; overflow-wrap: anywhere; }
.diff .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.diff del { color: var(--pen); text-decoration-thickness: 2px; }
.diff mark { background: transparent; color: var(--good); font-weight: 700; border-bottom: 2px solid var(--good); }
.override { align-self: flex-start; }

.notice { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; color: var(--muted); }
.notice.bad { color: var(--ink); background: var(--pen-bg); border-color: transparent; }
.notice code { background: var(--paper); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
.chip .new { display: inline-block; margin-left: 6px; font: 700 .62rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.chip[aria-pressed="true"] .new { color: inherit; opacity: .8; }
.chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.fb .ex { font-style: italic; color: var(--ink); opacity: .85; font-size: .92rem; overflow-wrap: anywhere; }
.tx { color: var(--muted); font-weight: 400; margin-left: 6px; }

/* ===== topics version ===== */
.topicrow { grid-template-columns: auto 1fr auto; }
.topicrow .ord { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--paper); border: 1.5px solid var(--rule); font: 700 1rem var(--f-body); color: var(--accent); }
.topicrow .t small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); margin-top: 1px; }
.topicrow:hover { border-color: var(--accent); }
.panel { display: flex; flex-direction: column; gap: 14px; }
.tabs button { font-size: .88rem; padding: 10px 8px; }
#topic .ctx-mode { line-height: 1.25; text-wrap: balance; }

/* grammar */
.gram { gap: 10px; scroll-margin-top: 12px; }
.gram h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; }
.gram h3 { margin: 6px 0 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.gram p { margin: 0; overflow-wrap: anywhere; }
.gram ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.tblwrap { overflow-x: auto; margin: 0 -4px; }
.gram table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.gram th, .gram td { border-bottom: 1px solid var(--rule); padding: 7px 6px; text-align: left; vertical-align: top; }
.gram th { color: var(--muted); font-weight: 600; font-size: .8rem; }
.gram tr:last-child td { border-bottom: 0; }
.examples { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 4px; }
.examples .ru { color: var(--muted); }
.tip { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.tip::before { content: "✎ "; color: var(--pen); font-weight: 700; }
.gram s { color: var(--pen); }
.practise { align-self: flex-start; padding: 9px 14px; font-size: .9rem; }
.jump { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 6px 0; margin: -6px 0; }

/* vocabulary */
.theme { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 14px; }
.theme summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto auto; grid-template-areas: "chev name num go" "chev bar bar go";
  align-items: center; gap: 4px 10px; padding: 12px 12px 12px 14px; cursor: pointer; }
.theme summary::-webkit-details-marker { display: none; }
.theme .chev { grid-area: chev; color: var(--muted); transition: transform .15s; font-size: .8rem; }
.theme[open] .chev { transform: rotate(90deg); }
.theme .th-name { grid-area: name; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.theme .th-num { grid-area: num; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.theme .mini { grid-area: bar; height: 5px; border-radius: 9px; background: var(--rule); overflow: hidden; }
.theme .mini span, .topicrow .mini span { display: block; height: 100%; background: var(--good); }
.theme .th-go { grid-area: go; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); font: 600 .85rem var(--f-body); cursor: pointer; }
.wordlist { list-style: none; margin: 0; padding: 0 14px 8px; }
.wordlist li { display: grid; grid-template-columns: 8px 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--rule); cursor: pointer; }
.wordlist .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; grid-row: span 2; }
.wordlist b { font-weight: 600; overflow-wrap: anywhere; }
.wordlist .wgroup { display: block; padding: 14px 0 4px; border-top: 0; cursor: default; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.wordlist .wru { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .theme .chev { transition: none; } }

/* tasks */
.intro { margin: 0; color: var(--muted); font-size: .92rem; }
.rulelink { align-self: flex-start; text-align: left; background: none; border: 0; padding: 4px 0; color: var(--accent); font: 600 .9rem var(--f-body); cursor: pointer; }
.theme summary:focus-visible, .th-go:focus-visible, .rulelink:focus-visible, .wordlist li:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="notice">Loading…</div>
  <div id="loadError" class="notice bad" hidden></div>

  <!-- ===== Screen 1: topics ===== -->
  <div id="menu" class="screen" hidden>
    <header>
      <div>
        <h1>My English</h1>
        <p class="hello" id="hello">Book topics · grammar, words, translation</p>
      </div>
      <div class="score" id="totalScore" title="Learned words, all topics">– / –</div>
    </header>

    <button class="continue" id="continueBtn" hidden>
      <span class="c-lbl">Continue</span>
      <span class="c-what" id="continueWhat"></span>
      <span class="c-go" aria-hidden="true">→</span>
    </button>

    <section>
      <p class="label">Topics</p>
      <div class="rows" id="topicList"></div>
    </section>

    <div class="foot"><span id="storeInfo">Progress is saved in this browser</span></div>
  </div>

  <!-- ===== Screen 2: one topic ===== -->
  <div id="topic" class="screen" hidden>
    <div class="topbar">
      <button class="back" id="topicBack">← Topics</button>
      <div class="ctx"><span class="ctx-mode" id="tTitle"></span><span class="ctx-set" id="tSub"></span></div>
      <div class="score small" id="tScore" title="Learned words in this topic">– / –</div>
    </div>
    <div class="seg tabs" role="tablist" aria-label="Section">
      <button role="tab" id="tab-grammar" data-tab="grammar">📖 Grammar</button>
      <button role="tab" id="tab-vocab" data-tab="vocab">🃏 Vocabulary</button>
      <button role="tab" id="tab-tasks" data-tab="tasks">✍️ Tasks</button>
    </div>
    <div class="panel" id="panel-grammar" role="tabpanel"></div>
    <div class="panel" id="panel-vocab" role="tabpanel"></div>
    <div class="panel" id="panel-tasks" role="tabpanel"></div>
    <div class="foot">
      <span></span>
      <span id="resetArea"><button class="link" id="resetBtn">Reset progress in this topic</button></span>
    </div>
  </div>

  <!-- ===== Screen 3: practice (Learn or Translate) ===== -->
  <div id="practice" class="screen" hidden>
    <div class="topbar">
      <button class="back" id="backBtn">← Back</button>
      <div class="ctx"><span class="ctx-mode" id="ctxMode"></span><span class="ctx-set" id="ctxSet"></span></div>
      <div class="score small" id="score" title="Learned in this selection">– / –</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="meta"><span id="topicName"></span><span class="box" id="boxInfo"></span></div>
      <p class="prompt" id="prompt"></p>
      <p class="task" id="task"></p>
      <div id="answerArea"></div>
      <div id="feedback"></div>
      <div class="row">
        <button class="btn main" id="mainBtn">Check</button>
        <button class="btn ghost" id="altBtn" hidden>Still learning</button>
        <button class="btn ghost" id="speakBtn" title="Listen to the English">🔊 Listen</button>
      </div>
    </section>

    <section class="progress">
      <p class="label" style="margin:0">Progress</p>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>

<!--
  DATA: the whole course lives in the JSON block below. Format and rules: README.md and CLAUDE.md.
  {"topics": [{"id", "order", "title", "pages", "added",
               "grammar": [{"id", "title", "body"}],        body: light markup (see README)
               "themes":  {"key": "Theme name"},
               "words":   [{"id", "en", "ru", "tr", "topic", "group", "ex", "exRu"}],   topic = theme key, group = optional sub-heading
               "tasks":   [{"id", "ru", "en": ["main answer", "other accepted answers"], "grammar"}]}]}
  Run `python3 tools/check.py` after editing: tasks and examples may use only words from this topic and earlier ones.
-->
<script id="words" type="application/json">
{
  "topics": [
    {
      "id": "topic-01",
      "order": 1,
      "title": "Topic 1 · Sounds & first words",

        {"id": "g-article", "title": "Неопределённый артикль a / an",
         "body": "Артикль **a / an** произошёл от слова *one* — «один». Он ставится только перед **исчисляемым** существительным **в единственном числе** и значит «один из многих, какой-то, любой».\n\n> I can't find a taxi. — Не могу найти такси. (Какое? Любое.)\n\nВо множественном числе артикль не ставится:\n\n> a book → books\n\n### a или an?\n| a [ə] — перед согласным звуком | an [ən] — перед гласным звуком |\n| a bus | an uncle |\n| a plate | an umbrella |\n| a year | an hour |\n\n! Смотрим на **звук**, а не на букву. *Hour* начинается с гласного звука [aʊ], поэтому **an hour**. *Year* начинается с согласного [j], поэтому **a year**."},
        {"id": "g-plural", "title": "Множественное число существительных",
         "body": "Множественное число образуется окончанием **-s** или **-es**. Окончание читается по-разному:\n\n| Звук | Когда | Примеры |\n| [s] | после глухих согласных | weeks, plates, cakes, forks |\n| [z] | после звонких согласных и гласных | days, games, trees, names |\n| [ɪz] | после s, ss, sh, ch, x и свистящих | boxes, dresses, watches, faces |\n\n### Особые формы\n| Один | Много |\n| a man — мужчина | men |\n| a woman — женщина | women |\n| a child — ребёнок | children |\n| a foot — ступня | feet |\n| a tooth — зуб | teeth |\n| a mouse — мышь | mice |\n| a person — человек | people |\n| a goose — гусь | geese |\n\nНе меняются совсем: **fish, sheep, deer**.\n\n> one fish — three fish, one sheep — nine sheep\n\n### Только множественное число\n**clothes, trousers, pyjamas, glasses, jeans, tights, scissors, goods, police** — после них глагол во множественном числе (*are*):\n\n> The scissors are on the desk.\n> My jeans are in the box.\n\n### Только единственное число\n**hair, money, advice, news, information, knowledge, music, fruit**, а также bread, butter, meat, water, milk, sugar, salt, rice, gold, luck, patience, progress, work, research, sleep, traffic, weather.\n\nПосле них глагол в единственном числе (*is*), и артикль **a / an не ставится**:\n\n> My hair is long. — Мои волосы длинные.\n> The money is in the box. — Деньги в коробке.\n\n! По-русски «волосы», «деньги», «фрукты» — множественное число, а по-английски **hair, money, fruit** — единственное."},
        {"id": "g-pronouns", "title": "Местоимения: I — me — my",
         "body": "У каждого местоимения три формы:\n\n| Кто? | Кого? Кому? | Чей? |\n| I — я | me — меня, мне | my — мой |\n| he — он | him — его, ему | his — его |\n| she — она | her — её, ей | her — её |\n| it — он, она, оно | it | its — его, её |\n| we — мы | us — нас, нам | our — наш |\n| you — ты, вы | you — тебя, вам | your — твой, ваш |\n| they — они | them — их, им | their — их |\n\n### После глагола — форма «кого? кому?»\n> Phone **me**! — Позвони мне!\n> Buy **him** a cake. — Купи ему торт.\n> Show **her** the book. — Покажи ей книгу.\n> Pass **them** the bread. — Передай им хлеб.\n> I know **them**. — Я их знаю.\n\n### Перед существительным — форма «чей?»\n> **my** book, **his** car, **our** house, **their** dog\n\n! **it / its** — для предметов и животных: The dog has got **its** ball."}

      "grammar": [
        {"id": "g-tobe", "title": "Глагол to be: am / is / are",
         "body": "**to be** — быть, находиться, являться. По-русски в настоящем времени этот глагол пропускают («Я дома»), а по-английски он **обязателен**:\n\n> I **am** at home. — Я дома.\n\n| + | ? | − |\n| I am (I'm) | Am I? | I am not (I'm not) |\n| he / she / it is (he's) | Is he? | he is not (isn't) |\n| we / you / they are (we're) | Are we? | we are not (aren't) |\n\n### Какая форма?\n- **I** → **am**\n- **he, she, it** → **is**\n- **you, we, they** → **are**\n\n### Схема\n- **(+)** кто + am / is / are: *She is tired.*\n- **(?)** Am / Is / Are + кто: *Are you busy?*\n- **(−)** кто + am / is / are + **not**: *He is not ill.*\n\n### to be + прилагательное\nlate, on time, at home, at work, tired, ill, well, busy, strong, angry, kind, hungry, rich, sad\n\n> I am late. — Я опоздал. (дословно: я есть опоздавший)\n> We are hungry. — Мы голодные.\n\n! **Прилагательное или наречие?** *good* — хороший (какой?), *well* — хорошо (как?). *bad* — плохой, *badly* — плохо. Окончание **-ly** делает из прилагательного наречие. Но *I am well* — «я здоров».\n\n! **Вспомогательные глаголы (auxiliary verbs):** be (am, is, are, was, were, been), have (has, have, had), do (do, does, did). **to + глагол** — инфинитив (начальная форма): to be, to have."},
        {"id": "g-wh", "title": "Специальные вопросы (Wh-questions)",
         "body": "Вопросительное слово ставится **в начало** предложения.\n\n| Слово | Значение |\n| what | что? какой? |\n| where | где? куда? откуда? |\n| when | когда? |\n| why | почему? |\n| who | кто? |\n| whose | чей? |\n| how | как? |\n| what time | в какое время? |\n| how old | сколько лет? |\n| how much | сколько? (стоит) |\n| what colour | какого цвета? |\n\n### Порядок слов\n**Wh + am / is / are + кто**\n\n> What is your name? — Как тебя зовут?\n> Why are you sad? — Почему тебе грустно?\n> Where is my pen? — Где моя ручка?\n\n**Whose + существительное + is / are + this / that…**\n\n> Whose camera is this? — Чей это фотоаппарат?\n> Whose slippers are these? — Чьи это тапочки?\n\n! Предлог уходит **в конец**: **Where are you from?** — Откуда ты?\n\n! **Who** часто сам — подлежащее: *Who is at home?* — Кто дома?"},
        {"id": "g-demo", "title": "This / these, that / those",
         "body": "| | Рядом, здесь | Далеко, там |\n| Один | **this** — этот | **that** — тот |\n| Много | **these** — эти | **those** — те |\n\n> I have got a book in my hand. **This** book is blue. — Эта книга голубая.\n> I see a book on the shelf. **That** book is brown. — Та книга коричневая.\n\n> This is a flower. → These are flowers.\n> That is a pear. → Those are pears.\n> What is this? — This is a pie.\n> What are these? — These are pies.\n> What is that? — That is a car.\n> What are those? — Those are cars.\n> Those are her children. — Это (вон те) её дети.\n\n! После **these / those** — глагол **are** и существительное во множественном числе: These **are** flower**s**."},
        {"id": "g-poss", "title": "Притяжательные местоимения: my и mine",
         "body": "Перед существительным — **my, your, his, her, its, our, their**.\n\nЕсли существительное не нужно повторять, используем **абсолютную форму**: **mine, yours, his, hers, ours, theirs**.\n\n| Перед существительным | Без существительного |\n| my book | mine — мой |\n| your book | yours — твой, ваш |\n| his book | his — его |\n| her book | hers — её |\n| its book | its — его, её |\n| our book | ours — наш |\n| their book | theirs — их |\n\n> This is my camera. = This is **mine**.\n> The white cat is **his**, not **hers**.\n> These keys are **yours**, not **mine**.\n> — Whose camera is this? — It is **mine**.\n> These are her earrings. = These are **hers**.\n\n! После абсолютной формы существительное **не ставится**: ~~mine book~~ → **my** book."}
      ],

        {"id": "g-cardinal", "title": "Количественные числительные (сколько?)",
         "body": "Количественные числительные отвечают на вопрос **сколько?**: *one, two, three…*\n\n### 13–19: окончание -teen\nfour → four**teen**, six → six**teen**, nine → nine**teen**\n\nОсобое написание: **thirteen** (three), **fifteen** (five), **eighteen** (eight, одна t).\n\nУдарение падает на оба слога: seventeen [ˌsevnˈtiːn].\n\n### 20–90: окончание -ty\nsix → six**ty**, seven → seven**ty**, nine → nine**ty**\n\n| Десятки | |\n| 20 | **twenty** |\n| 30 | **thirty** |\n| 40 | **forty** (без u!) |\n| 50 | **fifty** |\n| 60 | sixty |\n| 70 | seventy |\n| 80 | **eighty** |\n| 90 | ninety |\n\n### Десятки + единицы — через дефис\n> 21 — twenty-one, 56 — fifty-six, 99 — ninety-nine\n\n### Сотни, тысячи, миллионы\n> 100 — a (one) hundred\n> 101 — a hundred and one\n> 200 — two hundred\n> 1,000 — a (one) thousand\n> 1,000,000 — a million\n> 1,000,000,000 — a billion\n\n! **hundred, thousand, million** после числа **не получают -s**: *two hundred books*, ~~two hundreds books~~.\n\n! Разряды отделяются **запятой**: 7,250 (по-русски 7250), 1,380,000 (по-русски 1 380 000)."},
        {"id": "g-ordinal", "title": "Порядковые числительные (который?)",
         "body": "Порядковые числительные отвечают на вопрос **который?** и почти всегда идут с **the**: *the first, the tenth*.\n\n### Особые: first, second, third\n| Число | Который? | Сокращение |\n| 1 | the **first** | 1st |\n| 2 | the **second** | 2nd |\n| 3 | the **third** | 3rd |\n| 4 | the fourth | 4th |\n| 21 | the twenty-**first** | 21st |\n| 22 | the twenty-**second** | 22nd |\n| 23 | the twenty-**third** | 23rd |\n\n### Все остальные: + th\nfour → four**th**, six → six**th**, eleven → eleven**th**, hundred → hundred**th**\n\nМеняется написание:\n- five → **fifth**\n- eight → **eighth** (одна t)\n- nine → **ninth** (без e)\n- twelve → **twelfth**\n\n### Десятки: y → ie + th\n> twenty → twent**ieth**, thirty → thirt**ieth**, ninety → ninet**ieth**\n\n> January is the first month. — Январь — первый месяц.\n> Tuesday is the second day of the week. — Вторник — второй день недели."},
        {"id": "g-dates", "title": "Числа в датах, предлоги in / on",
         "body": "### Годы: по две цифры\n> 1992 — nineteen ninety-two\n> 1999 — nineteen ninety-nine\n> 1853 — eighteen fifty-three\n\n! Годы после 2000 читают так: 2005 — *two thousand and five*, 2026 — *twenty twenty-six*.\n\n### Даты: порядковое числительное\nПишется: **2nd Jan.** или **2.1.**, читается: **the second of January** или **January the second**.\n\nПишется: **May 15th, 1943** или **15.5.43**, читается: **May the fifteenth, nineteen forty-three**.\n\n### Предлоги времени\n| Предлог | С чем | Пример |\n| **in** | времена года | in summer, in winter |\n| **in** | месяцы | in September |\n| **in** | годы | in 1992 |\n| **on** | дни недели | on Tuesday |\n| **on** | даты | on the second of May |\n| **on** | будни | on weekdays |\n| **at** | выходные | at the weekend |\n\n> The children have a holiday **in** summer. — Летом у детей каникулы.\n> Please, call me **on** Tuesday. — Позвони мне, пожалуйста, во вторник.\n> I was in Italy **in** September. — В сентябре я был в Италии.\n\n! **Без предлога**: this week, last week, next week, every day, today, tomorrow, yesterday, once a week, twice a week. ~~on this week~~ → **this week**.\n\n### Арифметика\n> 2 + 3 = 5 — two **plus** three **equals** five\n> 8 − 3 = 5 — eight **minus** three equals five\n> 4 × 2 = 8 — four **times** two equals eight\n> 10 : 2 = 5 — ten **divided by** two equals five\n\n! Вместо **equals** можно сказать **is**: *Two plus three is five.*\n\n### Дроби\n> 1/2 — a half / one half\n> 1/4 — a quarter / one fourth\n> 1/3 — one third\n> 3/4 — three quarters / three fourths"}

         "body": "Как и в русском, в английском есть **исчисляемые** (их можно посчитать: *an apple — two apples*) и **неисчисляемые** существительные (посчитать нельзя: *milk, sugar, money*).\n\n| Исчисляемые | Неисчисляемые |\n| apple, bag | milk, snow |\n| desk, ruler | sugar, sand |\n| girl, handkerchief | butter, money |\n| room, plant | |\n\n### Что ставить перед существительным\n- исчисляемое в ед. ч. → **a / an**: *a bag, an apple*\n- исчисляемое во мн. ч. → **some / any**: *some apples*\n- неисчисляемое → **some / any**: *some milk*, ~~a milk~~, ~~milks~~\n\n! Неисчисляемые — всегда **единственное число**: *The money **is** in my bag.* (по-русски «деньги» — мн. ч., а в английском **is**)."},
        {"id": "g-someany", "title": "Some / any (немного, сколько-нибудь)",

        {"id": "g-muchmany", "title": "Много: many / much / a lot of",
         "body": "В английском несколько слов со значением **много**.\n\n| | Исчисляемые (мн. ч.) | Неисчисляемые |\n| много | **many** (apples) | **much** (milk) |\n| много | **a lot of** (apples) | **a lot of** (milk) |\n\n### many — с исчисляемыми\n> I have got many English books at home. — У меня дома много английских книг.\n> How many children have you got? — Сколько у тебя детей?\n\n### much — с неисчисляемыми\n> I haven't got much money. — У меня не много денег.\n> How much time have you got? — Сколько у тебя времени?\n\n### a lot of — с теми и другими\n> I have got a lot of friends. — У меня много друзей.\n> He has got a lot of free time. — У него много свободного времени.\n\n### Где что употребляется (пометки в книге)\n| | + | − | ? |\n| a lot of | ✓ | ✓ | ✓ |\n| many | ✓ | ✓ | ✓ |\n| much | | ✓ | ✓ |\n\n! В утвердительном предложении вместо **much** говорят **a lot of**: *I have got a lot of money*, ~~I have got much money~~."},
        {"id": "g-fewlittle", "title": "Немного / мало: a few, few, a little, little",
         "body": "| | Исчисляемые | Неисчисляемые |\n| много | many (apples), a lot of | much (milk), a lot of |\n| немного | **a few** (apples) | **a little** (milk) |\n| мало | **few** (apples) | **little** (milk) |\n| несколько | some (+), any (− ?) | some (+), any (− ?) |\n\n**a few / a little** — немного, несколько (есть, и этого хватает).\n**few / little** — мало (почти нет, не хватает).\n\n> I have got a few friends. — У меня есть несколько друзей.\n> I have got few friends. — У меня мало друзей.\n> I have got a little time. — У меня есть немного времени.\n> I have got little time. — У меня мало времени.\n\n! Всё решает **a**: *a little* = немного (есть), *little* = мало (почти нет)."}

function cloudSet(k, s) {

/* ---------- helpers ---------- */
const today = () => Math.floor(Date.now() / 864e5);
const rec = it => (progress[it.store] || {})[it.id];
const boxOf = it => (rec(it) ? rec(it)[0] : 0);
const bucketOf = it => { const r = rec(it); return !r ? 0 : r[0] === 0 ? 1 : r[0] + 1; };
const learnedIn = list => list.filter(it => boxOf(it) >= LEARNED_FROM).length;
const curTopic = () => TOPICS.find(t => t.id === state.topic);
const shortTitle = t => t ? t.title.replace(/^Topic \d+ · /, "") : "";
const themeName = (t, k) => k === "all" ? "All words" : (t.themes[k] || "Other");
const grammarTitle = (t, id) => id === "all" ? "All sentences" : ((t.grammar.find(g => g.id === id) || {}).title || "");
function wordPool() { const t = curTopic(); return t ? t.words.filter(w => state.theme === "all" || (w.topic || "_other") === state.theme) : []; }
function taskPool() { const t = curTopic(); return t ? t.tasks.filter(k => state.gfilter === "all" || k.grammar === state.gfilter) : []; }
const pool = () => (state.mode === "learn" ? wordPool() : taskPool());
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function pickNext() {
  const p = pool();
  if (state.mode === "learn") {             // new words first, in book order
    const unseen = p.find(it => !rec(it));
    if (unseen) return unseen;
  }
  const list = p.length > 1 ? p.filter(it => it.key !== lastKey) : p;
  const weights = list.map(it => Math.pow(2, MAX_BOX - boxOf(it)) * (rec(it) ? 1 : 1.5));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= weights[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

/* ---------- grammar markup: "### sub", "| table |", "> example", "- list", "! tip", **bold**, *italic*, ~~wrong~~ ---------- */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/~~(.+?)~~/g, "<s>$1</s>").replace(/\*(.+?)\*/g, "<i>$1</i>");
}
function example(line) {
  const i = line.indexOf(" — ", 1);
  if (i > 0 && /[а-яё]/i.test(line.slice(i))) return `<p><span class="en">${inline(line.slice(0, i))}</span> <span class="ru">${inline(line.slice(i + 1))}</span></p>`;
  return `<p>${inline(line)}</p>`;
}
function markup(src) {
  const lines = src.split("\n"); let html = "", i = 0;
  const special = /^(### |\||> |- |! )/;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("### ")) { html += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim())); i++; }
      html += `<div class="tblwrap"><table><thead><tr>${rows[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
      continue;
    }
    if (l.startsWith("> ")) {
      const ex = [];
      while (i < lines.length && lines[i].startsWith("> ")) { ex.push(lines[i].slice(2)); i++; }
      html += `<div class="examples">${ex.map(example).join("")}</div>`;
      continue;
    }
    if (l.startsWith("- ")) {
      const li = [];
      while (i < lines.length && lines[i].startsWith("- ")) { li.push(lines[i].slice(2)); i++; }
      html += `<ul>${li.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`;
      continue;
    }
    if (l.startsWith("! ")) { html += `<p class="tip">${inline(l.slice(2))}</p>`; i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !special.test(lines[i])) { para.push(lines[i]); i++; }
    html += `<p>${inline(para.join(" "))}</p>`;
  }
  return html;
}

/* ---------- answer checking ---------- */
function norm(s) {
  return s.toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/\([^)]*\)/g, " ")
    .replace(/[.,!?…;:"«»—–-]/g, " ")
    .replace(/\bcolor\b/g, "colour").replace(/\bfavorite\b/g, "favourite").replace(/\bgray\b/g, "grey")
    .replace(/\bmom'?s\b/g, "mum's").replace(/\bmom\b/g, "mum")
    .replace(/\b(what|who|it|that|there|he|she|where|how|this)'s\b/g, "$1 is")
    .replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not")
    .replace(/\b(\w+)n't\b/g, "$1 not")
    .replace(/\bi'm\b/g, "i am").replace(/\b(\w+)'re\b/g, "$1 are").replace(/\b(\w+)'ve\b/g, "$1 have").replace(/\b(\w+)'ll\b/g, "$1 will")
    .replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
  for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[a.length][b.length];
}
function lcsAlign(a, b) {
  const n = a.length, m = b.length, d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const inA = new Array(n).fill(false), inB = new Array(m).fill(false);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (a[i] === b[j]) { inA[i] = inB[j] = true; i++; j++; }
    else if (d[i+1][j] >= d[i][j+1]) i++; else j++;
  }
  return { len: d[0][0], inA, inB };
}
// right = matches one accepted answer; almost = same words with small spelling typos; wrong = different words
function gradeSentence(input, targets) {
  const a = norm(input);
  if (!a) return "empty";
  const ts = targets.map(norm);
  if (ts.includes(a)) return "right";
  const ok = ts.some(b => {
    const ta = a.split(" "), tb = b.split(" ");
    if (ta.length !== tb.length) return false;
    let typos = 0;
    for (let i = 0; i < tb.length; i++) {
      if (ta[i] === tb[i]) continue;
      const d = lev(ta[i], tb[i]), w = tb[i].length;
      if (w < 4 || d > (w >= 7 ? 2 : 1)) return false;
      typos++;
    }
    return typos <= 2;
  });
  return ok ? "almost" : "wrong";
}
const wkey = w => norm(w).replace(/ /g, "");
function closest(input, targets) {
  const a = input.trim().split(/\s+/).map(wkey);
  let best = targets[0], bestScore = -1;
  targets.forEach(t => { const b = t.split(/\s+/).map(wkey); const s = lcsAlign(a, b).len * 2 - b.length; if (s > bestScore) { bestScore = s; best = t; } });
  return best;
}
function renderDiff(input, target) {
  const rawA = input.trim().split(/\s+/), rawB = target.trim().split(/\s+/);
  const { inA, inB } = lcsAlign(rawA.map(wkey), rawB.map(wkey));
  const box = el("div", "diff");
  const line = (label, words, flags, tag) => {
    box.append(el("span", "lbl", label));
    const row = el("span");
    words.forEach((w, i) => row.append(el(flags[i] ? "span" : tag, null, w), document.createTextNode(" ")));
    box.append(row);
  };
  line("Your answer", rawA, inA, "del");
  line("Correct", rawB, inB, "mark");
  return box;
}

/* ---------- navigation: menu → topic → practice (browser / Telegram back goes one level up) ---------- */
const PARENT = { practice: "topic", topic: "menu" };
let depth = 0;
function showScreen(name) {
  if (screen === "practice" && name !== "practice") { try { speechSynthesis.cancel(); } catch {} }
  screen = name;
  ["menu", "topic", "practice"].forEach(s => { $(s).hidden = s !== name; });
  if (inTelegram) {
    name === "menu" ? tg.BackButton.hide() : tg.BackButton.show();
    name === "practice" ? tg.MainButton.show() : tg.MainButton.hide();
  }
  if (name === "menu") renderMenu();
  if (name === "topic") renderTopic();
  window.scrollTo(0, 0);
  if (name === "topic" && pendingScroll) {
    const target = $(pendingScroll); pendingScroll = null;
    if (target) setTimeout(() => target.scrollIntoView({ block: "start" }), 30);
  }
}
function go(name) {
  showScreen(name);
  try { history.pushState({ screen: name }, ""); depth++; } catch {}
}
function goBack() {
  if (screen === "menu") return;

  showScreen(PARENT[screen]);
}

  if (learn) {
    $("topicName").textContent = themeName(t, it.topic && t.themes[it.topic] ? it.topic : "_other") + (it.group ? " · " + it.group : "");
    $("prompt").textContent = it.en + (it.tr ? "  " + it.tr : "");
    const left = pool().filter(x => !rec(x)).length;
    $("task").textContent = left ? `New: ${left} left · try to recall the meaning` : "Review · try to recall the meaning";
    const hint = el("button", "hint", "Tap to see the translation"); hint.id = "reveal";
    hint.addEventListener("click", reveal);
    area.append(hint, swipeHint());
    setMainText("Show translation");
    speak(it.en);
    return;
  }
  $("topicName").textContent = grammarTitle(t, it.grammar);
  $("prompt").textContent = it.ru;
  $("task").textContent = "Translate into English";
  const ta = el("textarea"); ta.id = "answer"; ta.setAttribute("autocapitalize", "sentences"); ta.spellcheck = false; ta.rows = 3;
  ta.placeholder = "Type the English sentence…";
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onMain(); } });
  area.append(ta);
  setMainText("Check");
  if (!inTelegram && window.matchMedia("(pointer: fine)").matches) setTimeout(() => ta.focus({ preventScroll: true }), 30);
}
function swipeHint() {
  const sh = el("div", "swipehint");
  const rp = el("button", "swipebtn repeat", "← Repeat"), kn = el("button", "swipebtn know", "I know it →");
  rp.type = kn.type = "button"; rp.title = "Same as swiping left (←)"; kn.title = "Same as swiping right (→)";
  rp.addEventListener("click", () => swipeOut(false));
  kn.addEventListener("click", () => swipeOut(true));
  sh.append(rp, kn); return sh;
}

function reveal() {
  if (answered) return;
  answered = true; haptic("tap");
  const it = current, area = $("answerArea"); area.innerHTML = "";
  const f = el("div", "flip");
  [["ru", it.ru], ["ex", it.ex], ["exru", it.exRu]].forEach(([c, x]) => { if (x) f.append(el("span", c, x)); });
  area.append(f, swipeHint());
  setMainText("I know it ✓");
  $("altBtn").hidden = false;
}
function learnAnswer(known, viaSwipe = false) {
  if (!answered && !viaSwipe) return;
  answered = true;
  record(known); haptic(known ? "success" : "warning");
  renderCard();
}

let undoRecord = null;
function record(ok) {
  const it = current;
  const p = progress[it.store] || (progress[it.store] = {});
  undoRecord = { store: it.store, id: it.id, prev: p[it.id] ? p[it.id].slice() : null };
  const r = p[it.id] || [0, 0, 0];
  r[1]++; r[2] = today(); r[0] = ok ? Math.min(MAX_BOX, r[0] + 1) : 0;
  p[it.id] = r;
  saveProgress(it.store);
  renderProgress();
}
function overrideCorrect() {
  if (!undoRecord) return;
  const { store, id, prev } = undoRecord;
  const r = prev ? prev.slice() : [0, 0, 0];
  r[1]++; r[2] = today(); r[0] = Math.min(MAX_BOX, r[0] + 1);
  progress[store][id] = r; saveProgress(store); renderProgress();
  undoRecord = null; haptic("success");
  const fb = $("feedback").querySelector(".fb");
  fb.className = "fb good"; fb.querySelector(".mark").textContent = "Counted as correct ✓";
  const b = $("overrideBtn"); if (b) b.remove();
}

function check() {
  const inp = $("answer"), it = current;
  const g = gradeSentence(inp.value, it.en);
  if (g === "empty") { inp.focus(); haptic("warning"); return; }
  answered = true; inp.disabled = true;
  const ok = g !== "wrong";
  record(ok); haptic(ok ? "success" : "error");
  const target = g === "right" ? (it.en.find(e => norm(e) === norm(inp.value)) || it.en[0]) : closest(inp.value, it.en);
  const fb = el("div", "fb " + (ok ? "good" : "bad"));
  fb.append(el("span", "mark", { right: "Well done! ✓", almost: "Almost! Check the spelling", wrong: "Not quite:" }[g]));
  if (g === "right") fb.append(el("span", "ans", target));
  else fb.append(renderDiff(inp.value, target));
  const others = it.en.filter(e => e !== target);
  if (others.length) fb.append(el("span", "tr", "Also correct: " + others.join(" · ")));
  if (g === "wrong") {
    const o = el("button", "link override", "My answer is also correct"); o.id = "overrideBtn";
    o.addEventListener("click", overrideCorrect); fb.append(o);
  }
  const t = curTopic(), gt = grammarTitle(t, it.grammar);
  if (gt) {
    const r = el("button", "rulelink", "📖 See the rule: " + gt + " →"); r.id = "ruleLink";
    r.addEventListener("click", () => { state.tab = "grammar"; saveUiState(); pendingScroll = "sec-" + it.grammar; goBack(); });
    fb.append(r);
  }
  $("feedback").innerHTML = ""; $("feedback").append(fb);
  $("speakBtn").hidden = false;
  speak(target);
  setMainText("Next →");
}

function onMain() {
  if (!current) return;
  if (state.mode === "learn") return answered ? learnAnswer(true) : reveal();
  if (answered) return renderCard();
  check();
}

function renderProgress() {
  const list = pool(), buckets = [0, 0, 0, 0, 0];
  list.forEach(it => { buckets[bucketOf(it)] += 1; });
  $("bar").innerHTML = list.length ? buckets.map((n, i) => n ? `<span style="width:${n / list.length * 100}%;background:${BOX_COLORS[i]}" title="${BOX_NAMES[i]}: ${n}"></span>` : "").join("") : "";
  $("legend").innerHTML = buckets.map((n, i) => `<span><i style="background:${BOX_COLORS[i]}"></i>${BOX_NAMES[i]} ${n}</span>`).join("");
  $("score").textContent = `${learnedIn(list)} / ${list.length}`;
}

/* ---------- speech ---------- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.split(/\s*\/\s*/)[0].replace(/\([^)]*\)/g, "").replace(/…/g, ""));
    u.lang = "en-GB"; u.rate = 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}
function speakCurrent() {
  if (!current) return;
  if (state.mode === "learn") speak(current.en);
  else if (answered) speak(current.en[0]);
}

/* ---------- swipe (Learn): right = I know it, left = repeat ---------- */
(function setupSwipe() {
  const card = $("card");
  let sw = null, suppressClick = false;
  const reset = () => { card.classList.remove("dragging"); card.style.transform = ""; delete card.dataset.swipe; };
  card.addEventListener("pointerdown", e => {
    if (screen !== "practice" || state.mode !== "learn" || !current || e.button > 0) return;
    if (e.target.closest("#mainBtn, #altBtn, #speakBtn, .swipebtn")) return;
    sw = { x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId };
  });
  card.addEventListener("pointermove", e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.active) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.active = true; card.classList.add("dragging");
        try { card.setPointerCapture(sw.id); } catch {}
      } else if (Math.abs(dy) > 14) { sw = null; return; }
      else return;
    }
    sw.dx = dx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    if (dx > 50) card.dataset.swipe = "right"; else if (dx < -50) card.dataset.swipe = "left"; else delete card.dataset.swipe;
  });
  const end = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const { active, dx } = sw; sw = null;
    if (!active) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
    card.classList.remove("dragging");
    if (Math.abs(dx) < 90) { reset(); return; }
    swipeOut(dx > 0);
  };
  /* fly the card out like a finished swipe, then record the answer (also used by the buttons) */
  let flying = false;
  window.swipeOut = known => {
    if (flying || screen !== "practice" || state.mode !== "learn" || !current) return;
    flying = true;
    card.dataset.swipe = known ? "right" : "left";
    card.style.transform = `translateX(${known ? 120 : -120}%) rotate(${known ? 12 : -12}deg)`;
    setTimeout(() => {
      card.classList.add("dragging"); reset();
      learnAnswer(known, true);
      requestAnimationFrame(() => { card.classList.remove("dragging"); flying = false; });
    }, 200);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", e => { if (sw && e.pointerId === sw.id) { sw = null; reset(); } });
  card.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ---------- wiring ---------- */
$("mainBtn").addEventListener("click", onMain);
$("altBtn").addEventListener("click", () => learnAnswer(false));
$("speakBtn").addEventListener("click", speakCurrent);
$("backBtn").addEventListener("click", () => goBack());
$("topicBack").addEventListener("click", () => goBack());
$("continueBtn").addEventListener("click", () => {
  const saved = parse(lsGet(LS_STATE)) || {};
  if (!TOPICS.some(t => t.id === saved.topic)) return;
  Object.assign(state, { topic: saved.topic, theme: saved.theme || "all", gfilter: saved.gfilter || "all", tab: saved.tab || "grammar" });
  go("topic");
  startPractice(saved.mode === "tasks" ? "tasks" : "learn");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && screen !== "menu") { goBack(); return; }
  if (screen !== "practice") return;
  if (e.target.id === "answer" || e.target.tagName === "BUTTON") return;
  if (e.key === "Enter" && (answered || state.mode === "learn")) { e.preventDefault(); onMain(); }
  if (state.mode !== "learn") return;
  if (answered && (e.key === "Backspace" || e.key === "2")) learnAnswer(false);
  if (e.key === "ArrowRight") swipeOut(true);
  if (e.key === "ArrowLeft") swipeOut(false);
});
$("resetArea").addEventListener("click", e => {
  const id = e.target.id, area = $("resetArea");
  const plain = `<button class="link" id="resetBtn">Reset progress in this topic</button>`;
  if (id === "resetBtn") {
    area.innerHTML = `<span class="confirm">Delete words and tasks progress for this topic? <button class="link danger" id="resetYes">Yes, reset</button><button class="link" id="resetNo">Cancel</button></span>`;
  } else if (id === "resetYes") {
    ["ew_p_", "ew_t_"].forEach(p => { progress[p + state.topic] = {}; saveProgress(p + state.topic); });
    area.innerHTML = plain; renderTopic();
  } else if (id === "resetNo") area.innerHTML = plain;
});

(async function start() {
  setupTelegram();
  if (cloudOK) $("storeInfo").textContent = "Progress syncs with your Telegram account";
  try {
    TOPICS = loadData();
  } catch (err) {
    $("loading").hidden = true;
    const box = $("loadError"); box.hidden = false;
    box.textContent = "The course data in this page has a formatting error: " + err.message;
    return;
  }
  await loadProgress(TOPICS.flatMap(t => ["ew_p_" + t.id, "ew_t_" + t.id]));
  const saved = parse(lsGet(LS_STATE)) || {};
  if (TOPICS.some(t => t.id === saved.topic)) Object.assign(state, { topic: saved.topic, tab: saved.tab || "grammar", theme: saved.theme || "all", gfilter: saved.gfilter || "all" });
  else state.topic = TOPICS[0] && TOPICS[0].id;
  try { history.replaceState({ screen: "menu" }, ""); } catch {}
  $("loading").hidden = true;
  showScreen("menu");
})();
</script>
